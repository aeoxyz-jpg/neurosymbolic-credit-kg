name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          uv venv
          uv pip install -e ".[dev]"
      - name: Ruff
        run: |
          uv run ruff format --check scripts/ tests/
          uv run ruff check scripts/ tests/
      - name: Pytest
        run: uv run pytest -v

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          uv venv
          uv pip install -e ".[dev]"
      - name: Start Fuseki (in-memory dataset for CI)
        run: |
          docker run -d --name fuseki -p 3030:3030 \
            conceptkernel/jena-fuseki:6.0.0-1 \
            --update --mem /credit-risk
          for i in $(seq 1 30); do
            curl -sf http://localhost:3030/$/ping && break
            sleep 1
          done
          curl -sf http://localhost:3030/$/ping
      - name: Load ontology + verify Phase A
        run: |
          uv run python scripts/load_ontology.py ontology/credit_risk.ttl
          uv run python scripts/load_ontology.py ontology/instances/customers.ttl
          uv run python scripts/load_ontology.py ontology/instances/applications.ttl
          uv run python scripts/verify_phase_a.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Pellet reasoner smoke test
        run: |
          JAVA_EXE="$JAVA_HOME/bin/java" \
            uv run python scripts/run_reasoner.py --apply-r5 --output /tmp/inferred.ttl
          uv run python - <<'EOF'
          from rdflib import RDF, Graph, Namespace
          g = Graph()
          g.parse("/tmp/inferred.ttl", format="turtle")
          NS = Namespace("https://nikko.dev/ontology/credit#")
          primes = list(g.subjects(RDF.type, NS.PrimeApplicant))
          reviews = list(g.triples((None, NS.hasDecision, NS.Review)))
          print(f"PrimeApplicants={len(primes)} ReviewDecisions={len(reviews)}")
          raise SystemExit(0 if primes and reviews else 1)
          EOF
